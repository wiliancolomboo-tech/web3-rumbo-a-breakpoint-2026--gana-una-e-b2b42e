[package]
name = "rumbo_protocol"
version = "0.1.0"
description = "Decentralized Milestone-Gated Travel Fellowship & Ticket Escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rumbo_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }