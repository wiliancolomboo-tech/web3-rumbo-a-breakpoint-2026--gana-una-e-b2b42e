version: "3.8"

services:
  rumbo-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Rumb026BreakpointTravelGrant11111111111111111
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_SENDER=travel@rumbo-breakpoint.lat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"