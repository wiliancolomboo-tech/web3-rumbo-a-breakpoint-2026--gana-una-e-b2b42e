version: "3.8"

services:
  camino-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camino-breakpoint-worker
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - PROGRAM_ID=${PROGRAM_ID:-Cam1no1111111111111111111111111111111111111}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_SLACK_WEBHOOK_URL=${DISCORD_SLACK_WEBHOOK_URL}
      - LOG_LEVEL=info
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"