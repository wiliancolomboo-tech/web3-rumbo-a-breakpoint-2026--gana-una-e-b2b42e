[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rumbo_protocol = "RumbobREAkp01nt2026111111111111111111111111"

[programs.devnet]
rumbo_protocol = "RumbobREAkp01nt2026111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
start-agent = "ts-node agent/rumbo_sentinel.ts"