[package]
name = "rumbo-breakpoint"
version = "0.1.0"
description = "Solana Breakpoint 2026 Developer Fellowship and Travel Escrow Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rumbo_breakpoint"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }