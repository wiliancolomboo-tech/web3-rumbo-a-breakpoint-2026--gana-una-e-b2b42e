version: '3.8'

services:
  flightdeck-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightdeck-breakpoint-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - PROGRAM_ID=RumbokR6eRkJ3G3H25J9k9yP1P2gXh8qWbNnmE7tYv6
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3