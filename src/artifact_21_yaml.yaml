version: "3.8"

services:
  breakpoint-verifier-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakpoint_verifier_daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - VERIFIER_PRIVATE_KEY=${VERIFIER_PRIVATE_KEY}
      - CAMPAIGN_PUBKEY=${CAMPAIGN_PUBKEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=travel@solanabreakpoint2026.com
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(process.uptime())'"]
      interval: 30s
      timeout: 10s
      retries: 3