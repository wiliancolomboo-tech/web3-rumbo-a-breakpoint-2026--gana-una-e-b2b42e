version: '3.8'

services:
  rumbo-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo_orchestrator_daemon
    restart: always
    environment:
      - NODE_ENV=production
      - PROGRAM_ID=RumbobReakpo1nt20261111111111111111111111
      - SOLANA_RPC_HTTP_URL=https://api.devnet.solana.com
      - SOLANA_RPC_WS_URL=wss://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_NOTIFY_EMAIL=sponsors@solana.com
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"