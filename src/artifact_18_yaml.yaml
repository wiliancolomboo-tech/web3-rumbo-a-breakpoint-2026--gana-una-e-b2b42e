version: '3.8'

services:
  rumbo-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=RumboxQx6Zt3K6m1pB4uTfV2YvN8WpZ9cDeFgHjK1Mn
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ANCHOR_WALLET=/app/keys/relayer-keypair.json
    volumes:
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Worker Active')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"