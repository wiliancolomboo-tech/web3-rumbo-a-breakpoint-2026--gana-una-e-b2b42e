version: '3.8'

services:
  rumbo-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo_breakpoint_worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=RumbobXjA5Fw5yHhBqHk1Y1L2mC8oY3P4r8q6g3tB2n
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"