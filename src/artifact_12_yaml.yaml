version: "3.8"

services:
  solpath-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solpath_worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=SP26rumBoBreakPointTravel11111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SENDER_EMAIL=grants@solpath.events
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"