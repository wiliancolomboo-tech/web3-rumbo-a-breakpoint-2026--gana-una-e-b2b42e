version: "3.8"

services:
  solpath-listener:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=BrkPnt2026111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=grants@solpath.io
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RECIPIENT_OVERRIDE_EMAIL=${RECIPIENT_OVERRIDE_EMAIL:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"