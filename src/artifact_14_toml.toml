[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.devnet]
rumbo_protocol = "RumbobReakpo1nt2026GrantEscrow1111111111111"

[registry]
url = "https://api.apr.dev"

