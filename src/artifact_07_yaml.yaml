version: "3.8"

services:
  rumbo-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo_breakpoint_agent
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=RumbocFh9JvWkmFq9vY9qg8yV7qN5u8kL2vX4Xo1QWz
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - OPS_NOTIFICATION_EMAIL=breakpoint-grants@solana.org
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"