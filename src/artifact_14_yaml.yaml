version: '3.8'

services:
  rumbo-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo-automation-daemon
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Rumbo111111111111111111111111111111111111111
      - OPERATOR_PRIVATE_KEY=${OPERATOR_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3