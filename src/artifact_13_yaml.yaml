version: "3.8"

services:
  rumbo-event-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo_breakpoint_worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WSS_URL=wss://api.devnet.solana.com
      - RUMBO_PROGRAM_ID=Rumb020261111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SCHOLAR_NOTIFY_EMAIL=builders@superteam.fun
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3