version: "3.8"

services:
  rumbo-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumbo_breakpoint_oracle
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Rumb011111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - FROM_EMAIL=grants@solanabreakpoint2026.com
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"